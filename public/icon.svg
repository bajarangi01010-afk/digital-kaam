<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#042f2e" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.4"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with 3D Radius -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- 3D Glass Layer -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" filter="url(#shadow3d)"/>
  
  <!-- 3D Shield / Base -->
  <path d="M256 100 L380 150 C380 270 330 360 256 410 C182 360 132 270 132 150 Z" fill="url(#glowGrad)" filter="url(#shadow3d)"/>
  <path d="M256 116 L364 160 C364 262 320 342 256 388 C192 342 148 262 148 160 Z" fill="#042f2e" opacity="0.2"/>

  <!-- 3D Crossed Tools: Wrench & Screwdriver -->
  <g transform="translate(256,245) scale(0.95)">
    <!-- Wrench -->
    <path d="M-60 -90 C-40 -110 -10 -100 -5 -80 L65 5 C75 18 70 35 55 45 L45 55 C35 70 18 75 5 65 L-80 -5 C-100 -10 -110 -40 -90 -60 L-70 -40 L-40 -70 Z" fill="url(#goldGrad)" filter="url(#shadow3d)"/>
    <!-- Center Bolt / Star -->
    <circle cx="0" cy="-5" r="32" fill="#ffffff" filter="url(#shadow3d)"/>
    <path d="M0 -30 L8 -12 L28 -12 L12 2 L18 20 L0 8 L-18 20 L-12 2 L-28 -12 L-8 -12 Z" fill="#0d9488"/>
  </g>

  <!-- Top 3D Light Highlight -->
  <ellipse cx="256" cy="65" rx="160" ry="25" fill="#ffffff" opacity="0.3" filter="blur(8px)"/>
</svg>
