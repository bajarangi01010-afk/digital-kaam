name: digital_kaam_flutter
description: "Digital Kaam - Two-Sided Trust Verification & Local Services Marketplace"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking & HTTP
  dio: ^5.4.1

  # Hardware & Camera
  camera: ^0.10.5+9
  camera_windows: ^0.2.5
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  geolocator: ^14.0.3
  s2geometry: ^0.2.1
  url_launcher: ^6.3.0

  # UI & Styling
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
