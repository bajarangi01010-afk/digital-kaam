services:
  - type: web
    name: digital-kaam
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port "
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FAST2SMS_API_KEY
        sync: false
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
