services:
  - type: web
    name: digital-kaam-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn smart_brain_service:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FAST2SMS_API_KEY
        sync: false
      - key: SMS_GATEWAY_PROVIDER
        value: fast2sms
      - key: SB_JWT_SECRET
        generateValue: true
      - key: SB_ADMIN_API_KEY
        generateValue: true
